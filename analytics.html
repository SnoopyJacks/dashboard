<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review sessions, bounce rate, average visit duration, and click-through rate in Dash analytics." />
    <meta name="theme-color" content="#0f172a" />
    <title>Website Analytics | Dash</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <!-- Dashboard Container -->
    <div class="dashboard">
      <!--Sidebar Navigation-->
      <aside class="sidebar">
        <p class="logo" aria-label="Dash home">Dash</h2>
        <nav aria-label="Primary navigation">
          <a href="index.html">Dashboard</a>
          <a href="reports.html">Reports</a>
          <a class="active" href="analytics.html" aria-current="page">Analytics</a>
          <a href="settings.html">Settings</a>
        </nav>
      </aside>
      <!--Main Content Area-->
      <main class="main" id="main-content">
        <header class="topbar">
          <h1>Analytics</h1>
        </header>
        <!--Statistics-->
        <section class="stats" aria-labelledby="analytics-summary-heading">
          <h2 class="sr-only" id="analytics-summary-heading">Analytics summary</h2>
          <div class="card">
            <p class="label">Sessions</p>
            <p class="metric">24,000</p>
          </div>
          <div class="card">
            <p class="label">Bounce Rate</p>
            <p class="metric">28%</p>
          </div>
          <div class="card">
            <p class="label">Avg. Time</p>
            <p class="metric"><span aria-label="3 minutes and 42 seconds">3m 42s</span></p>
          </div>
          <div class="card">
            <p class="label"><abbr title="Click-through rate">CTR</abbr></p>
            <p class="metric">4.8%</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
