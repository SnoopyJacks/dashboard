<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore monthly revenue trends and business performance reports in Dash." />
  <meta name="theme-color" content="#0f172a" />
  <title>Revenue Reports | Dash</title>
  <link rel="stylesheet" href="styles.css">
</head>
  <body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <!-- Dashboard Container -->
  <div class="dashboard">
    <!--Sidebar Navigation-->
    <aside class="sidebar">
      <p class="logo" aria-label="Dash home">Dash</p>
      <nav aria-label="Primary navigation">
        <a href="index.html">Dashboard</a>
        <a class="active" href="reports.html" aria-current="page">Reports</a>
        <a href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
      </nav>
    </aside>
<!--Main Content Area-->
    <main class="main" id="main-content">
      <header class="topbar">
        <h1>Reports</h1>
      </header>
<!--Charts-->
  <section class="charts" aria-labelledby="reports-charts-heading">
    <h2 class="sr-only" id="reports-charts-heading">Report charts</h2>
    <div class="chart">
      <h3>Monthly Revenue</h3>
      <svg
      viewBox="0 0 420 250"
      class="line-chart"
      role="img"
      aria-labelledby="monthly-revenue-title monthly-revenue-desc"
    >
      <title id="monthly-revenue-title">Monthly revenue line chart</title>
    
      <desc id="monthly-revenue-desc">
        Revenue increased from $10,000 in January to $40,000 in June.
      </desc>
    
      <!-- Y-axis -->
      <line class="axis" x1="55" y1="20" x2="55" y2="210" />
    
      <!-- X-axis -->
      <line class="axis" x1="55" y1="210" x2="400" y2="210" />
    
      <!-- Horizontal grid lines -->
      <g class="grid-lines">
        <line x1="55" y1="210" x2="400" y2="210" />
        <line x1="55" y1="165" x2="400" y2="165" />
        <line x1="55" y1="120" x2="400" y2="120" />
        <line x1="55" y1="75" x2="400" y2="75" />
        <line x1="55" y1="30" x2="400" y2="30" />
      </g>
    
      <!-- Y-axis numbers -->
      <g class="axis-labels">
        <text x="45" y="214" text-anchor="end">$0</text>
        <text x="45" y="169" text-anchor="end">$10k</text>
        <text x="45" y="124" text-anchor="end">$20k</text>
        <text x="45" y="79" text-anchor="end">$30k</text>
        <text x="45" y="34" text-anchor="end">$40k</text>
      </g>
    
      <!-- X-axis month labels -->
      <g class="axis-labels">
        <text x="70" y="232" text-anchor="middle">Jan</text>
        <text x="130" y="232" text-anchor="middle">Feb</text>
        <text x="190" y="232" text-anchor="middle">Mar</text>
        <text x="250" y="232" text-anchor="middle">Apr</text>
        <text x="310" y="232" text-anchor="middle">May</text>
        <text x="370" y="232" text-anchor="middle">Jun</text>
      </g>
    
      <!-- Revenue line -->
      <polyline
        class="revenue-line"
        points="70,165 130,145 190,120 250,95 310,65 370,30"
      />
    
      <!-- Data points -->
      <g class="data-points">
        <circle cx="70" cy="165" r="5" />
        <circle cx="130" cy="145" r="5" />
        <circle cx="190" cy="120" r="5" />
        <circle cx="250" cy="95" r="5" />
        <circle cx="310" cy="65" r="5" />
        <circle cx="370" cy="30" r="5" />
      </g>
    </svg>
      </div>
    </section>
  </main>
  </div>
  </body>
</html>
